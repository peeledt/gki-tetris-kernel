name: GKI IPSET, BT, Docker, BBR & CAKE — (KMI android14-11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Освободить диск
        run: |
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          AVAIL=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          AVAIL=${AVAIL:-0}
          if [ "$AVAIL" -ge 45 ]; then
            sudo mkdir -p /mnt/kernel
            sudo chown -R $USER:$USER /mnt/kernel
            echo "BUILD_DIR=/mnt/kernel" >> "$GITHUB_ENV"
          else
            mkdir -p "$GITHUB_WORKSPACE/kernel"
            echo "BUILD_DIR=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"
          fi

      - name: Подготовка окружения
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl zip unzip rsync lz4
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.email "ci@builder.local"
          git config --global user.name  "CI Builder"
          git config --global color.ui false

      - name: Настройка кэша Bazel и Repo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel_disk_cache
            ~/.repo_cache
          key: ack-android14-6.1-${{ hashFiles('common/Makefile') }}
          restore-keys: |
            ack-android14-6.1-

      - name: Синхронизация ACK common-android14-6.1
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ~/.repo_cache
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android14-6.1 \
            --reference=~/.repo_cache
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle \
            --optimized-fetch --prune --fail-fast
          echo "--- Контроль KMI (android14-11) ---"
          grep -E "BRANCH|KMI_GENERATION" common/build.config.constants

      - name: Конфигурация ядра (IPSET, BT, Docker, BBR, CAKE, eBPF)
        working-directory: ${{ env.BUILD_DIR }}/common
        run: |
          # 1. Удаляем старые/конфликтующие параметры из defconfig
          sed -i -E '/CONFIG_BT(_.*)?=/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_RFKILL(_.*)?=/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_IP_SET(_.*)?=/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_NETFILTER_XT_SET/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_UHID/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_PID_NS/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_USER_NS/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_CGROUP_DEVICE/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_CGROUP_PIDS/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_CFS_BANDWIDTH/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_BRIDGE_NETFILTER/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_NETFILTER_XT_MATCH_ADDRTYPE/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_MACVLAN/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_IPVLAN/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_TCP_CONG_BBR/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_NET_SCH_CAKE/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_NET_SCH_FQ/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_NET_SCH_FQ_CODEL/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_BPF_SYSCALL/d' arch/arm64/configs/gki_defconfig
          sed -i -E '/CONFIG_BPF_JIT/d' arch/arm64/configs/gki_defconfig

          # 2. Прописываем монолитную сборку прямо в ядро (=y)
          cat >> arch/arm64/configs/gki_defconfig <<'DEFCONFIG'
          # ==== IPSET Core & Modules ====
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_SET=y

          # ==== RFKILL Core ====
          CONFIG_RFKILL=y
          CONFIG_RFKILL_INPUT=y

          # ==== Bluetooth Stack Built-in ====
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HS=y
          CONFIG_BT_LE=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_QCA=y
          CONFIG_BT_HCIUART_LL=y
          CONFIG_BT_HCIUART_SERDEV=y
          CONFIG_BT_HCIBTSDIO=y
          CONFIG_UHID=y

          # ==== Docker: Пространства имён & Изоляция ====
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y

          # ==== Docker: Контрольные группы (Cgroups) ====
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_BLK_CGROUP=y
          CONFIG_BLK_DEV_THROTTLING=y

          # ==== Docker: Сеть и Netfilter (IPv4) ====
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_DUMMY=y

          # ==== Docker: Хранилище ====
          CONFIG_OVERLAY_FS=y

          # ==== TCP BBR + FQ Pacing ====
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y

          # ==== CAKE Qdisc (Smart Queue Management) ====
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_CLS_ACT=y

          # ==== eBPF Core & JIT Compiler ====
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_BPF_STREAM_PARSER=y
          DEFCONFIG

      - name: Отключить strict проверки сборщика
        working-directory: ${{ env.BUILD_DIR }}/common
        run: |
          sed -i 's/gki_modules_list = \[\] + _COMMON_GKI_MODULES_LIST/gki_modules_list = []/' modules.bzl
          sed -i 's/kmi_symbol_list_strict_mode = True/kmi_symbol_list_strict_mode = False/' BUILD.bazel

      - name: Отключить check_defconfig
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          sed -i 's/check_defconfig//' common/build.config.gki
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true

      - name: Сборка ядра (Kleaf)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ~/.cache/bazel_disk_cache
          tools/bazel run --config=fast --lto=none --notrim --allow_undeclared_modules \
            --nokmi_symbol_list_strict_mode \
            --disk_cache=~/.cache/bazel_disk_cache \
            //common:kernel_aarch64_dist -- --destdir="$BUILD_DIR/out/dist" \
          || tools/bazel run --config=fast --lto=none --notrim --allow_undeclared_modules \
            --nokmi_symbol_list_strict_mode \
            --disk_cache=~/.cache/bazel_disk_cache \
            //common:kernel_aarch64_dist -- --dist_dir="$BUILD_DIR/out/dist"
          
          echo "--- Проверка версии KMI ---"
          strings "$BUILD_DIR/out/dist/Image" | grep -m1 "6\.1\..*android14-11"

      - name: Выгрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: GKI-fixed-Image
          path: |
            ${{ env.BUILD_DIR }}/out/dist/Image
            ${{ env.BUILD_DIR }}/out/dist/Image.lz4
          retention-days: 14