name: GKI KernelSU-Next — CMF Phone 1 (tetris, KMI android14-11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Освободить диск (без сторонних actions)
        run: |
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          echo "--- место после очистки ---"
          df -h / /mnt
          AVAIL=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          AVAIL=${AVAIL:-0}
          if [ "$AVAIL" -ge 45 ]; then
            sudo mkdir -p /mnt/kernel
            sudo chown -R $USER:$USER /mnt/kernel
            echo "BUILD_DIR=/mnt/kernel" >> "$GITHUB_ENV"
          else
            echo "::warning::на /mnt мало места (${AVAIL}G), собираем в workspace"
            mkdir -p "$GITHUB_WORKSPACE/kernel"
            echo "BUILD_DIR=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"
          fi

      - name: Подготовка окружения
        run: |
          df -h "$BUILD_DIR" && nproc && free -g
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl zip unzip rsync lz4
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.email "ci@builder.local"
          git config --global user.name  "CI Builder"
          git config --global color.ui false

      - name: Синхронизация ACK common-android14-6.1
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android14-6.1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle \
            --optimized-fetch --prune --fail-fast
          echo "--- контроль KMI (должно быть KMI_GENERATION=11) ---"
          grep -E "BRANCH|KMI_GENERATION" common/build.config.constants
          head -1 common/Makefile

      - name: KernelSU-Next + снятие protected exports
        working-directory: ${{ env.BUILD_DIR }}/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          rm -f android/abi_gki_protected_exports_aarch64 android/abi_gki_protected_exports_x86_64
          git -C KernelSU-Next log --oneline -1

      - name: Фрагмент defconfig (без cfg80211/mac80211/BT/SND/IKHEADERS/BPF_LSM)
        working-directory: ${{ env.BUILD_DIR }}/common
        run: |
          cat >> arch/arm64/configs/gki_defconfig <<'DEFCONFIG'
          # ==== CUSTOM GKI — CMF Phone 1 (tetris), KMI android14-11 ====
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NF_TABLES_NETDEV=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_TPROXY=y
          CONFIG_NFT_SOCKET=y
          CONFIG_NFT_COMPAT=y
          CONFIG_NETFILTER_XT_MATCH_OSF=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_NET_NS=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_FHANDLE=y
          CONFIG_SECCOMP=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_KSM=y
          CONFIG_NLS=y
          CONFIG_NLS_DEFAULT="utf8"
          CONFIG_NLS_UTF8=y
          CONFIG_NLS_CODEPAGE_437=y
          CONFIG_NLS_ISO8859_1=y
          CONFIG_NTFS3_FS=y
          CONFIG_NTFS3_64BIT_CLUSTER=y
          CONFIG_NTFS3_LZX_XPRESS=y
          CONFIG_NTFS3_FS_POSIX_ACL=y
          CONFIG_CIFS=y
          CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
          CONFIG_ISO9660_FS=y
          CONFIG_JOLIET=y
          CONFIG_ZISOFS=y
          CONFIG_UDF_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XATTR=y
          CONFIG_SQUASHFS_ZLIB=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_LZ4=y
          CONFIG_SQUASHFS_ZSTD=y
          CONFIG_USB_MON=y
          CONFIG_NET_DROP_MONITOR=y
          CONFIG_PACKET_DIAG=y
          CONFIG_UNIX_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_BATMAN_ADV=y
          CONFIG_BATMAN_ADV_BATMAN_V=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_BPF_EVENTS=y
          CONFIG_USB_ACM=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CP210X=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_PL2303=y
          CONFIG_MII=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_RTL8152=y
          CONFIG_USB_NET_AX88179_178A=y
          CONFIG_INPUT_JOYDEV=y
          DEFCONFIG
          tail -5 arch/arm64/configs/gki_defconfig

      - name: Отключить check_defconfig (build.config.gki)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # Kleaf мапит POST_DEFCONFIG_CMDS из legacy build.config.gki
          # в свою проверку check_defconfig — чистим именно там
          sed -i 's/check_defconfig//' common/build.config.gki
          echo "--- POST_DEFCONFIG_CMDS после правки: ---"
          grep -n "POST_DEFCONFIG_CMDS" common/build.config.gki || echo "!! строка не найдена"
          # убираем -maybe-dirty из строки версии (дерево модифицировано)
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true

      - name: Сборка (Kleaf, без LTO)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          tools/bazel run --config=fast --lto=none --notrim --allow_undeclared_modules \
            //common:kernel_aarch64_dist -- --destdir="$BUILD_DIR/out/dist" \
          || tools/bazel run --config=fast --lto=none --notrim --allow_undeclared_modules \
            //common:kernel_aarch64_dist -- --dist_dir="$BUILD_DIR/out/dist"
          ls -lh "$BUILD_DIR/out/dist" | head -30
          echo "--- контроль версии (должно быть android14-11) ---"
          strings "$BUILD_DIR/out/dist/Image" | grep -m1 "6\.1\..*android14-11"

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSUNext-tetris
          path: |
            ${{ env.BUILD_DIR }}/out/dist/Image
            ${{ env.BUILD_DIR }}/out/dist/Image.lz4
            ${{ env.BUILD_DIR }}/out/dist/System.map
          retention-days: 30
